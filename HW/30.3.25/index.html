<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Document</title>
</head>

<body>
    <h1 style="font-family: 'Segoe UI';text-align: center;">Country Map</h1>
    <div style="display: flex;justify-content: center;">
        <select name="countrySelector" id="countrySelector">
        </select>

    </div>
    <div style="display: flex;justify-content: space-around;">
        <div>
            <canvas id="myChart1"></canvas>
        </div>
        <div>
            <canvas id="myChart2"></canvas>
        </div>

    </div>
    <div id="loader" style="width: 100%;display: flex;justify-content: center;">
        <div class="loading-wave">
            <div class="loading-bar"></div>
            <div class="loading-bar"></div>
            <div class="loading-bar"></div>
            <div class="loading-bar"></div>
        </div>
    </div>
    <div id="content" style="width: 100%;display: flex; flex-direction: column; justify-content: center;">
        <div style="display: flex; justify-content: center;" id="img"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./index.js"></script>
</body>

</html>
